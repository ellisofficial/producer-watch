name: Daily producer watch

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watch
        working-directory: scripts
        env:
          GENIUS_ACCESS_TOKEN: ${{ secrets.GENIUS_ACCESS_TOKEN }}
        run: python run_all.py

      - name: Commit updated data and dashboard
        run: |
          git config user.name "producer-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --quiet --cached || git commit -m "Daily update $(date -u +%F)"
          git push
